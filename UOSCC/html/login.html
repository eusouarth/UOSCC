<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Painel UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background-color: var(--primary-light);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: var(--primary);
        }

        .login-card p {
            color: #6C757D;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2>Painel de Transparência</h2>
        <p>Acesse com suas credenciais de OSC ou Administrador</p>
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail ou Usuário</label>
                <input type="text" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" required>
            </div>
            <button type="button" class="btn" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>
    </div>
</body>

</html>
