<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Relatórios - UOSCC</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="content">
            <div class="page-header">
                <div>
                    <h1>Relatório de prestação de contas</h1>
                    <p>Prestação de contas por OSC e período.</p>
                </div>
            </div>
            <form id="report-filters" class="report-filters">
                <label>OSC
                    <select name="organization">
                        <option value="">Todas as OSCs</option>
                    </select>
                </label>
                <label>De
                    <input type="date" name="from">
                </label>
                <label>Até
                    <input type="date" name="to">
                </label>
                <button type="submit" class="btn">Aplicar filtros</button>
                <button type="button" class="btn" id="exportar-csv">Exportar planilha</button>
                <button type="button" class="btn" id="exportar-pdf">Exportar PDF</button>
            </form>
            <div id="relatorio-conteudo"
                style="background: white; padding: 25px; border-radius: 8px; border: 1px solid var(--border-color);">
            </div>
        </div>
    </div>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
